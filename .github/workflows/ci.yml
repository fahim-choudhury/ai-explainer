name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"   # weekly: catches pinned downloads that disappear upstream

jobs:
  unit:
    runs-on: ubuntu-24.04
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.24"
      - run: uv sync --locked --python "$(jq -r .python deps/tools.json)"
      - run: .venv/bin/python -m pytest -q

  setup-from-empty:
    # The README promise: a fresh Linux machine with the system tools gets everything else from ./setup.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: System tools and Chromium libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 \
            libgbm1 libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libpango-1.0-0 \
            libcairo2 libcups2 libdrm2
      - name: Cache models (still verified by SHA256 on every run)
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('deps/models.json') }}
      - run: ./setup
