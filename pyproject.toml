[project]
name = "ai-explainer"
version = "0.1.0"
description = "Python side of the xv toolkit: Kokoro narration, Whisper checks, PDF text"
requires-python = "==3.14.*"
dependencies = [
  "kokoro-onnx==0.4.7",
  "faster-whisper==1.2.1",
  "soundfile==0.14.0",
  "numpy==2.5.4",
  "pillow==13.0.0",
  "pypdf==7.0.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest==9.0.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
